syntax = "proto3";

package pretzel.ai.v1;

// The mgmtd <-> pretzel-ai contract. Source of truth; mirrored into pretzel/mgmtd/grpc/.
// The mgmtd <-> pretzel-ai contract. mgmtd is the client (a person typing in the console);
// pretzel-ai is the server. Named for the service, not for one of its calls: it answers chat
// turns and it owns the tech-doc corpus behind them, so "Inference" stopped describing it. Streaming from the start: a chat turn comes back token-by-token so the console can
// render the answer as it arrives rather than after the whole thing is built.
service PretzelAi {
  // One chat turn. The reply is a stream of chunks; the final chunk has done=true and carries
  // the turn-level outcome (usage, and later the AIRS scan verdict — see the old
  // gateway_service.extract_scan for the shape those fields will take).
  rpc Chat(ChatRequest) returns (stream ChatChunk);

  // Which models this appliance may ask for. Answered from the config this daemon loaded, which is the
  // one place that knows — the gateway account decides what is reachable, so this is a fact about
  // the daemon and not a declaration the operator makes. That is why it comes back over the wire
  // instead of riding in running_config: a catalog committed there would be diffed and rolled back
  // like a policy, and rolling the configuration back does not put a model back in the gateway
  // account. Same reasoning as GetCorpusStatus, which reports what the store holds rather than
  // what someone declared it should hold.
  rpc ListModels(ListModelsRequest) returns (ModelList);

  // The assistant's deployment, pushed from the appliance. pretzel-ai is not on the IPC fabric, so
  // engined's ConfigApply broadcast cannot reach it; this is that broadcast's equivalent for the
  // one peer that lives off the bus.
  //
  // Push, not pull, and mgmtd is the one who pushes: engined owns the running config and mgmtd is
  // the only process with both a gRPC channel to here and the master key that opens the sealed
  // vendor credentials. pretzel-ai never reads the appliance database — a second writer, or even a
  // second reader with its own idea of "current", is how a console and a service start disagreeing
  // about what is deployed.
  //
  // Carries the keys. They are the one part that is not in running_config (it is append-versioned
  // and rendered verbatim in a review diff), so they are unsealed at the last moment and travel
  // here on a loopback channel — the same bargain the IPC socket already makes, where a device
  // credential crosses in plaintext once on entry and never on use.
  //
  // Sent whenever the appliance has reason to believe this service's view is stale: at handshake,
  // after a settings commit converges, and after a key is stored or removed. Idempotent, so
  // sending it again costs nothing and a missed one is repaired by the next.
  rpc ApplyConfig(ApplyConfigRequest) returns (ApplyConfigResult);

  // --- The tech-doc knowledge base -------------------------------------------------------
  //
  // The assistant answers out of a corpus crawled from docs.paloaltonetworks.com, and Palo Alto
  // republishes those docs continuously, so keeping it current is an operation the console has
  // to expose rather than a one-off import. It is split in two on purpose: Check is cheap (one
  // sitemap fetch) and tells the operator what a refresh would do, so Refresh is never a blind
  // 21,768-page download.

  // Re-fetch every page the sitemap lists and keep the ones that are documents. Streams progress
  // because it runs for the better part of an hour and the console holds a window open for it;
  // the stream is also the cancellation channel — mgmtd stops reading and the crawl stops.
  rpc RefreshCorpus(RefreshCorpusRequest) returns (stream RefreshProgress);

  // What is in the store right now: the card's resting state and the corpus browser's tree.
  rpc GetCorpusStatus(CorpusStatusRequest) returns (CorpusStatus);

  // The documents under one product/book, for the corpus browser. Titles and URLs only — the
  // bodies are what the assistant reads, not what an operator scrolls.
  rpc ListDocuments(ListDocumentsRequest) returns (DocumentList);

  // --- Benchmark sets ---------------------------------------------------------------------
  //
  // A set is one uploaded .jsonl. Several coexist: a result recorded last week was scored against
  // the set that existed last week, so an upload adds rather than replaces, and removal is an
  // explicit act. Every call is unary — the largest of them carries one file — so there is no
  // progress to stream and nothing to cancel.

  // Every stored set, newest first. Short by nature (one per uploaded file), so it is not paged.
  rpc ListBenchmarkDatasets(ListBenchmarkDatasetsRequest) returns (BenchmarkDatasetList);

  // Store one uploaded file. The whole file travels in one message; the server parses it before
  // opening a transaction, so a malformed upload costs nothing and holds no locks.
  rpc UploadBenchmarkDataset(UploadBenchmarkDatasetRequest) returns (UploadBenchmarkDatasetResult);

  // Change the label on a set. Never the prompts and never the digest: renaming a set must not
  // change what a result recorded against it means.
  rpc RenameBenchmarkDataset(RenameBenchmarkDatasetRequest) returns (BenchmarkDatasetResult);

  // Remove a set and its prompts.
  rpc DeleteBenchmarkDataset(DeleteBenchmarkDatasetRequest) returns (DeleteBenchmarkDatasetResult);

  // Composition of one set — the counts the header band needs, and the technique list its filter
  // is built from. Separate from ListBenchmark because it does not change as the operator pages.
  rpc GetBenchmarkSummary(BenchmarkSummaryRequest) returns (BenchmarkSummary);

  // One page of a set, filtered, in the uploaded file's own order.
  rpc ListBenchmark(ListBenchmarkRequest) returns (BenchmarkPage);

  // A whole set back out as .jsonl. Separate from ListBenchmark rather than a very large page of
  // it: the listing is paged and filtered for a table, and an export that inherited either would
  // silently hand back part of a set under the set's name.
  rpc ExportBenchmarkDataset(ExportBenchmarkDatasetRequest) returns (ExportBenchmarkDatasetResult);

  // --- Benchtest runs ---------------------------------------------------------------------
  //
  // Executing a set against the guardrail. Streaming for the same reason RefreshCorpus is: it
  // runs for minutes and the console holds a window open for it, and dropping the stream is how
  // it is cancelled — the runner marks the run cancelled rather than leaving it "running" and
  // blocking the next one.

  rpc RunBenchtest(RunBenchtestRequest) returns (stream RunProgress);

  // Runs that have already happened. Separate unary calls because a finished run is read long
  // after its stream ended — reopening the modal must not mean re-running anything.
  rpc ListBenchtestRuns(ListBenchtestRunsRequest) returns (BenchtestRunList);
  rpc GetBenchtestRun(GetBenchtestRunRequest) returns (BenchtestRunSummary);
  rpc ListBenchtestCases(ListBenchtestCasesRequest) returns (BenchtestCaseList);

  // One case with the whole exchange. Apart from the listing because this is the megabytes:
  // nothing wants them until an operator opens a case and asks what actually happened.
  rpc GetBenchtestCase(GetBenchtestCaseRequest) returns (BenchtestCaseDetail);
}

// One earlier turn of the conversation, replayed so the model — and the guardrail — can see what
// came before. Only user and assistant turns travel here; the system prompt is not one of them and
// stays in its own field, because it is the appliance's policy rather than part of the exchange.
message ChatTurn {
  string role = 1;     // "user" | "assistant"; anything else is dropped
  string content = 2;
}

message ChatRequest {
  string model = 1;          // "" -> the server's default model
  string message = 2;        // the person's turn
  string system_prompt = 3;  // optional override; "" -> server default

  // The turns before this one, oldest first, NOT including `message`. A chat turn is stateless on
  // the wire: the server keeps no conversation, so whatever context a turn should have is the
  // caller's to send. That is deliberate — mgmtd already owns the conversation the operator sees,
  // and a second copy on this side would be a second source of truth to keep in step.
  repeated ChatTurn history = 4;

  // Which conversation this turn belongs to. Forwarded to the gateway as x-portkey-trace-id, which
  // Portkey passes through to Prisma AIRS as its tr_id — the field AIRS groups scans by. Without
  // it AIRS mints a fresh id per call, so every turn lands in its own session and the Sessions view
  // can never show a conversation. "" -> let AIRS generate one.
  string session_id = 5;

  // One thing the operator asked for. Issued by mgmtd when the turn arrives, and constant for as
  // long as pretzel-ai works on it — which, once tool calls are in play, is several LLM round
  // trips rather than one. That is the whole reason it exists as a separate field: the agent loop
  // makes "a request" and "a model call" different units, and a scan can only be traced back to
  // the person who caused it if something survives the loop.
  //
  // The three ids nest, coarsest first:
  //   session_id      the conversation        (the browser mints it, cv_*)
  //   transaction_id  one operator request    (mgmtd, this field)
  //   tr_id           one LLM round trip      (pretzel-ai, per iteration; not on the wire)
  //
  // AIRS carries all three, so a scan report can be read at whichever level the question is
  // being asked at. "" -> pretzel-ai proceeds without one; it is a tracing aid, not a gate.
  string transaction_id = 6;
}

message ChatChunk {
  string delta = 1;   // text produced since the previous chunk (empty on the final chunk)
  bool   done = 2;    // true exactly once, on the last chunk
  string error = 3;   // set only when the turn failed; done is also true in that case

  // On the final chunk (done=true): the complete turn document as JSON — reply, the AIRS scan
  // verdict, usage, ok/code — the same shape the old inferd ChatResponse IPC payload carried,
  // which mgmtd files verbatim and the console parses. Empty on non-final chunks.
  string result_json = 4;
}

message ListModelsRequest {}

// --- The pushed deployment ---------------------------------------------------------------

message AiModel {
  string id = 1;           // "gpt-4o-2024-11-20" — the bare name the vendor answers to; the
                           // provider is the entry this sits under, not part of the id
  string label = 2;        // "GPT-4o" — what the picker shows
  string token_param = 3;  // the field this model wants its output cap in, when it is not
                           // "max_tokens". Empty means the default.
}

message AiProvider {
  string id = 1;                  // "openai" | "google" | "anthropic" — the half of a model name
                                  // before the slash, and the id its key is sealed under. Named for
                                  // the vendor, not the model family: the key belongs to Anthropic
                                  // and the endpoint answers for Anthropic; Claude is what they serve.
  repeated AiModel models = 2;    // the models this account may be asked for
  string api_key = 3;             // unsealed by mgmtd for this call. Empty when none is stored,
                                  // which is a provider that cannot serve — reported, not hidden.

  // 4, 5 retired: `enabled` and `url`. A provider is taken out of service by not being in the list,
  // which is how every other list in the appliance's configuration works; and the endpoint is a
  // fact about the vendor rather than a setting, so it is compiled in on this side — an operator
  // cannot point "openai" at something that is not OpenAI.
}

// Which of the four points in a turn are inspected.
//
// Four switches rather than one, because their consequences differ: a skipped tool_call is
// irreversible once the tool has run, while a skipped response only means nobody read the answer
// first. Off does NOT mean allow — the checkpoint answers NOT_INSPECTED, so a report can still
// tell a clean scan from one that never ran.
//
// Not every combination is reachable, and the unreachable ones are a fact about the deployment
// rather than a setting: Chat has no tools at all, and the AI gateway cannot see them (it builds
// its scan request from a completion's text `content`, and `tool_calls` is a sibling of `content`
// that never reaches the scanner). pretzel-ai reads these against what the service and the
// guardrail can actually serve; the console greys out what it cannot.
message Checkpoints {
  bool prompt = 1;        // before the model is called
  bool response = 2;      // after it answers, before anyone sees it
  bool tool_call = 3;     // after the model asks for a tool, BEFORE it runs
  bool tool_result = 4;   // after the tool ran, before its output re-enters the turn
}

// One of the services this appliance runs, and how its turns are inspected.
//
// Two of them, and they are separate engines rather than one engine in two modes: Chat calls a
// model and returns, Agent loops through tool calls. They are configured apart because the
// question "what should be inspected here" has different answers — Agent has two checkpoints Chat
// does not have, and an operator tuning one is not tuning the other.
//
// This travels now, and the guardrail half of it did not before. The earlier contract left the
// guardrail in pretzel-ai's own config.json so that an appliance changing which models it serves
// could not — by a console edit or a bug in one — change whether the turns were inspected. That
// bargain also made the guardrail unconfigurable without editing a file on the appliance and
// restarting the service, which is not something an operator can be asked to do. The console owns
// it now, the file is gone, and the protection is that every change is a committed, versioned
// running_config edit rendered in a review diff.
message ServiceConfig {
  string service = 1;     // "chat" | "agent" — which engine this configures. One entry each.

  // Who inspects, and by consequence which LLM leg serves the completion:
  //   "none"             nobody inspects; the vendors are called directly. A real deployment,
  //                      written down — every checkpoint reports NOT_INSPECTED rather than allowing.
  //   "api_application"  this appliance calls the Prisma AIRS scan API and holds the enforcement
  //                      point; the vendors are called directly.
  //   "ai_gateway"       the AI gateway routes the completion AND its own configuration governs
  //                      inspection. The leg is not a separate choice: there is no gateway on the
  //                      direct path to defer to, so choosing this moves the completion too.
  string guardrail = 2;

  Checkpoints checkpoints = 3;

  // api_application only. The endpoint is not here: it is a fact about the scan service, compiled
  // into pretzel-ai, and a console field for it only ever bought the chance to point "AIRS" at
  // something that is not AIRS.
  string airs_profile_name = 4;    // the security profile a scan is ruled against
  double airs_timeout_sec = 5;
  bool   airs_fail_open = 6;       // a scan that cannot be reached lets the turn through. Default
                                   // false: a guardrail that cannot rule stops the turn.

  // ai_gateway only. The endpoint is likewise compiled in — the hosted gateway.
  bool   gateway_require_verdict = 7;  // fail turns the gateway did not inspect. Without it,
                                       // deferring means trusting that something over there looked.
  double gateway_timeout_sec = 8;

  // How this service shapes a turn. Per service on purpose: an agent's system prompt is not a
  // chat's, and neither is its token cap.
  string system_prompt = 9;   // empty leaves pretzel-ai's own default in place
  int32  max_tokens = 10;     // 0 means unset
}

message ApplyConfigRequest {
  // The running_config version this was read from. Not a gate — the service applies whatever
  // arrives — but it is what makes a log line on either side answer "which configuration is this".
  uint64 version = 1;
  repeated AiProvider providers = 3;

  // Every service, whole, every time. An absent field in a proto3 message is indistinguishable
  // from a default, so a partial push could not express "clear the system prompt" or "stop
  // inspecting tool results" — mgmtd writes every field on every push, read from the running
  // config it just committed.
  repeated ServiceConfig services = 6;

  // The subscription keys, unsealed by mgmtd for this call. Appliance-wide rather than per
  // service: there is one AIRS subscription and one gateway subscription, and both services draw
  // on whichever they reference. Empty means none is stored — a service that needs it is a
  // configuration pretzel-ai refuses, reported rather than hidden.
  //
  // Not in running_config: that document is append-versioned and rendered verbatim in a review
  // diff, which is no place for a credential.
  string airs_api_key = 7;
  string gateway_api_key = 8;

  // 2 retired: `assistant` (default model, system prompt, max tokens, timeout) — now per service
  //   in ServiceConfig above.
  // 4, 5 retired: `guardrail` and `shape`, a single appliance-wide pair from when there was one
  //   engine. They became per-service the moment Chat and Agent were configured apart.
}

message ApplyConfigResult {
  bool ok = 1;
  string error = 2;     // why the document was refused; empty when ok
  uint64 version = 3;   // echoed back, so a reply cannot be mistaken for one to a later push
}

message Model {
  string id = 1;        // "@openai/gpt-4o-2024-11-20" — sent to the gateway verbatim; the
                        // @<integration-slug>/<model> form is Portkey's own routing syntax
  string label = 2;     // "GPT-4o" — what the picker shows
  string provider = 3;  // "OpenAI" — display only, derived from the slug when unset
}

message ModelList {
  repeated Model models = 1;
  string default_model = 2;  // the id the picker starts on; "" when the catalog is empty
  string error = 3;          // set only when the catalog could not be read
}

// --- Tech-doc corpus ---------------------------------------------------------------------

message RefreshCorpusRequest {
  string scope = 1;   // one product ("ngfw"); "" -> the whole sitemap
}

// Emitted every batch. `rejected` counts pages that were fetched and turned out not to be
// documents — 404s, redirects onto a page already stored, bodies that render to nothing. They are
// not shown to the operator individually: there is nothing to do about a page Palo Alto removed.
message RefreshProgress {
  string stage = 1;   // survey | start | fetch | done | failed | cancelled
  int32  done  = 2;
  int32  total = 3;   // during survey: URLs listed. after it: pages actually to fetch.

  int32  listed   = 4;
  int32  stored   = 5;
  int32  rejected = 6;

  // What the HEAD survey found, so the console can show a target the crawl can actually reach.
  // The sitemap lists ~21,900 URLs; a fifth redirect onto a page it also lists and a few hundred
  // are gone, which is why a bar drawn against the listed count never fills.
  int32 survey_ok       = 10;
  int32 survey_redirect = 11;
  int32 survey_missing  = 12;

  bool   final  = 7;  // true exactly once, on the last message
  string error  = 8;
  int64  run_id = 9;
}

message CorpusStatusRequest {}

// One row of the product/book tree, derived from the URL paths — docs.paloaltonetworks.com
// publishes one flat sitemap with no hierarchy of its own.
message ProductStat {
  string product   = 1;
  string docset    = 2;
  int32  documents = 3;
  int32  bodies    = 4;
  int64  chars     = 5;
}

message CorpusStatus {
  int32  documents = 1;
  int32  bodies    = 2;   // distinct bodies; documents/bodies is how much text is shared
  int64  chars     = 3;
  string last_run_at     = 4;
  string last_run_status = 5;
  int64  last_run_id     = 6;
  string error = 7;
  repeated ProductStat products = 8;
}

message ListDocumentsRequest {
  string product = 1;
  string docset  = 2;   // "" means the product's top level
}

message DocumentSummary {
  string url        = 1;
  string title      = 2;
  int32  char_count = 3;
  string lastmod    = 4;   // vendor's last edit, ISO-8601
}

message DocumentList {
  repeated DocumentSummary documents = 1;
  string error = 2;
}

// --- Benchmark sets ----------------------------------------------------------------------

// One uploaded file. `content_sha` is the digest of the bytes, hex-encoded — it is what makes a
// re-upload recognisable rather than duplicated, and what identifies the exact file a result was
// scored against.
message BenchmarkDataset {
  int64  id          = 1;
  string name        = 2;
  string filename    = 3;
  string content_sha = 4;
  int64  byte_size   = 5;
  int32  row_count   = 6;
  string note        = 7;
  string uploaded_by = 8;
  string uploaded_at = 9;   // ISO-8601
}

message ListBenchmarkDatasetsRequest {
  string search = 1;   // substring over name and filename; "" -> all
}

message BenchmarkDatasetList {
  repeated BenchmarkDataset datasets = 1;
  string error = 2;
}

message UploadBenchmarkDatasetRequest {
  bytes  content     = 1;   // the .jsonl, whole
  string filename    = 2;
  string name        = 3;   // "" -> derived from filename
  string note        = 4;
  string uploaded_by = 5;
}

// Three outcomes, and they are deliberately not collapsed into one error string:
//
//   dataset set, duplicate false   stored
//   dataset set, duplicate true    these exact bytes were already here; `dataset` is that set,
//                                  and nothing was created. Not a failure — the console points at
//                                  the set instead of reporting an error for work already done.
//   error set                      the file could not be read. `problems` carries the per-line
//                                  detail, already capped, so the operator can fix the file
//                                  rather than guess at what was wrong with it.
message UploadBenchmarkDatasetResult {
  BenchmarkDataset dataset = 1;
  bool   duplicate = 2;
  string error     = 3;
  repeated string problems = 4;
}

message RenameBenchmarkDatasetRequest {
  int64  dataset_id = 1;
  string name       = 2;
  string note       = 3;
}

message BenchmarkDatasetResult {
  BenchmarkDataset dataset = 1;
  string error = 2;        // set when the id does not exist
}

message DeleteBenchmarkDatasetRequest {
  int64 dataset_id = 1;
}

message DeleteBenchmarkDatasetResult {
  bool   deleted = 1;      // false means there was nothing under that id
  string error   = 2;
}

message BenchmarkSummaryRequest {
  int64 dataset_id = 1;
}

// One bucket of a breakdown: "A" -> 375, "malicious" -> 1000, "ko" -> 300.
message BenchmarkBucket {
  string key   = 1;
  int32  count = 2;
}

// A technique with the category it belongs to, so the console's dropdown narrows with the
// category chips instead of listing every bank in the set at once.
message BenchmarkTechnique {
  string category  = 1;
  string technique = 2;
  int32  count     = 3;
}

message BenchmarkSummary {
  BenchmarkDataset dataset = 1;
  repeated BenchmarkBucket    by_category = 2;
  repeated BenchmarkBucket    by_verdict  = 3;
  repeated BenchmarkBucket    by_language = 4;
  repeated BenchmarkTechnique techniques  = 5;
  repeated BenchmarkBucket    by_checkpoint = 7;
  string error = 6;
}

message ListBenchmarkRequest {
  int64 dataset_id = 1;
  // Empty means "no filter on this column". The server checks each name against its own closed
  // set and drops the ones it does not know, so a stale console still gets the table back.
  string category  = 2;
  string verdict   = 3;
  string language  = 4;
  string technique = 5;
  string search    = 6;   // substring over the contents text and the prompt id
  int32  offset    = 7;
  int32  limit     = 8;   // server-capped

  // "row_no" (the file's own order, the default) or "prompt_id". Anything else is ignored rather
  // than refused — an ordering the server does not know is not a reason to withhold the table.
  string order_by   = 9;
  bool   descending = 10;
  string checkpoint = 11;
}

// One prompt, as the uploaded file carried it. `extra` is whatever fields the file had that the
// schema has no column for, as a JSON object — kept so the stored set is not a lossy copy.
// 데이터셋 v2. 행 하나가 곧 AIRS 스캔 요청 1회이며, 판정 대상은 프롬프트 문자열이 아니라
// `contents_json`이 담은 요청 본문 배열이다.
//
// 5·8·11·12·13·14 는 v1 필드(category_en / scan_target / expected_labels / severity / origin /
// prompt)가 쓰던 번호다. proto3에서 지운 번호를 다시 쓰면 구버전 바이너리가 새 필드를 옛 타입으로
// 읽으므로 reserved 로 막아 둔다 — 콘솔과 서버가 같은 배포에서만 도는 보장이 없다.
message BenchmarkRow {
  reserved 5, 8, 11, 12, 13, 14;
  reserved "category_en", "scan_target", "expected_labels", "severity", "origin", "prompt";

  int32  row_no          = 1;   // position in the file, 1-based
  string prompt_id       = 2;
  string category        = 3;
  string category_ko     = 4;
  string verdict         = 6;   // malicious | benign — 이 행이 위협인가
  // block | allow — 이 행에 기대하는 처분. `verdict`(위협 여부)와 다른 축이라 이름을 갈랐다.
  string expected_action = 7;
  string language        = 9;   // mix | ko | en
  string technique       = 10;
  string extra_json      = 15;

  // prompt | response | response + context | tool_event (input) | tool_event (output)
  string checkpoint      = 16;
  // `블록.디텍터` 표기. prompt.injection, tool_output.dlp 처럼 어느 블록에서 떠야 하는지까지 담는다
  // — 같은 이름의 디텍터가 블록마다 있고, response 에는 injection 이 아예 없다.
  repeated string expected_detector = 17;
  // AIRS 요청의 contents 배열을 JSON 문자열 그대로. 구조를 proto 메시지로 옮기지 않는 이유는
  // 벤더 스키마가 바뀔 때 이 파일까지 따라 바뀌게 하지 않기 위해서다.
  string contents_json   = 18;
  // 알려진 한계를 일부러 남긴 행의 설명. 빈 문자열이면 그런 행이 아니다.
  string note            = 19;
}

message BenchmarkPage {
  int32  total  = 1;   // matching the filter, not the page
  int32  offset = 2;
  int32  limit  = 3;
  repeated BenchmarkRow rows = 4;
  string error = 5;
}

message ExportBenchmarkDatasetRequest {
  int64 dataset_id = 1;
}

message ExportBenchmarkDatasetResult {
  bytes  content  = 1;   // the whole set, one JSON object per line
  string filename = 2;   // what it arrived as, for the download name
  int32  row_count = 3;
  string error    = 4;
}

// --- Benchtest runs ----------------------------------------------------------------------

// The scope is the console's filter, forwarded rather than resolved here: pretzel-ai already
// applies the same filter to list the table, so the caller never has to know which prompts are in.
message RunBenchtestRequest {
  int64  dataset_id = 1;
  string category   = 2;
  string verdict    = 3;
  string language   = 4;
  string technique  = 5;
  string search     = 6;
  int32  workers    = 7;   // 0 -> the server's default
  string label      = 8;   // the run's name; "" -> the server does not name it
  string note       = 9;   // why it was made; optional
}

// One finished case, as the live list renders it. The request and response documents are NOT here
// — they are in the database, and streaming them per case would push megabytes through a window
// that shows one line each.
message RunCase {
  reserved 13;
  reserved "prompt";

  int32  seq        = 1;
  string prompt_id  = 2;
  string category   = 3;
  string technique  = 4;
  string language   = 5;
  // 기대값과 관측치를 같은 접두사로 짝짓는다. `actual`이 아니라 `observed`인 이유: 정답은
  // 우리가 붙인 라벨이고 AIRS의 답은 그 정답에 대고 재는 관측치다 — `actual`은 그 방향을
  // 거꾸로 말한다.
  string expected_action = 6;   // block | allow
  string observed_action = 7;   // AIRS 가 답한 action
  repeated string observed_detector = 8;   // 실제로 발화한 것
  string cause      = 9;
  bool   ok         = 10;
  bool   excluded   = 11;  // ok is not meaningful: uninspected, or the call failed
  int32  latency_ms = 12;

  string checkpoint = 14;
  repeated string expected_detector = 15;
  // hit | misclassified | miss | false_positive | clean_pass
  //
  // `ok` 불리언으로는 '차단됐지만 기대 디텍터는 안 뜬' 경우를 표현할 수 없다. 스캔 1회가 모든
  // 디텍터를 돌리기 때문에 그 구분이 곧 실질 커버리지이고, v1 에서 헤드라인 차단율이 실제 성능을
  // 가렸던 자리가 정확히 여기다.
  string outcome    = 16;
  repeated string threats = 17;
  // 세트에서 조인해 온 값. 알려진 한계를 일부러 남긴 케이스를 결과 화면에서 골라내려면
  // 목록 단계에서 이미 보여야 한다.
  string note       = 18;
}

message RunTally {
  string key   = 1;   // a cause
  int32  count = 2;
}

message RunProgress {
  string stage   = 1;   // started | case | finished | empty | failed
  int64  run_id  = 2;
  int32  done    = 3;
  int32  total   = 4;
  bool   final   = 5;   // true exactly once, on the last message
  string status  = 6;   // set on the last message: done | cancelled | failed
  string error   = 7;
  RunCase last_case = 8;          // set on stage "case"
  repeated RunTally tally = 9;    // running totals by cause
}

message BenchtestRun {
  int64  id          = 1;
  int64  dataset_id  = 2;
  string f_category  = 3;
  string f_verdict   = 4;
  string f_language  = 5;
  string f_technique = 6;
  string f_search    = 7;
  int32  selected    = 8;
  string status      = 9;
  string error       = 10;
  string model       = 11;
  string started_at  = 12;
  string ended_at    = 13;
  string label       = 14;
  string note        = 15;
}

message ListBenchtestRunsRequest {
  int64 dataset_id = 1;   // 0 -> every set
  int32 limit      = 2;
}

message BenchtestRunList {
  repeated BenchtestRun runs = 1;
  string error = 2;
}

message GetBenchtestRunRequest {
  int64  run_id    = 1;
  // The rates are computed over this scope; the breakdown chips stay run-wide.
  string category  = 2;
  string verdict   = 3;
  string language  = 4;
  string technique = 5;
  string search    = 6;
  string checkpoint = 7;
}

message BenchtestRunSummary {
  BenchtestRun run = 1;
  repeated RunTally tally = 2;
  // Breakdowns of the cases this run holds, for the Result tab's chips.
  repeated BenchmarkBucket by_category  = 7;
  repeated BenchmarkBucket by_verdict   = 8;
  repeated BenchmarkBucket by_language  = 9;
  // v2 의 정의축. 같은 위협이 어느 검사 시점에서 잡히고 놓치는지가 이 칩으로 갈린다 —
  // 대분류만으로는 21조합이 10칸으로 뭉개져 커버리지 구멍이 보이지 않는다.
  repeated BenchmarkBucket by_checkpoint = 11;
  repeated BenchmarkTechnique techniques = 10;
  // The two rates the report needs, and the gap between them is the point: attacks the model
  // itself refused never produced anything for the profile to scan.
  int32 detected = 3;   // attacks scored as caught
  int32 ruled    = 4;   // attacks that got a verdict at all (the raw denominator)
  int32 refused  = 5;   // of those, the ones the model declined
  string error   = 6;
}

message ListBenchtestCasesRequest {
  int64  run_id    = 1;
  string cause     = 2;   // "" -> every outcome
  int32  offset    = 3;
  int32  limit     = 4;
  // The same scope filters the Test tab has, applied within a run's cases.
  string category  = 5;
  string verdict   = 6;
  string language  = 7;
  string technique = 8;
  string search    = 9;
  string order_by   = 10;  // "seq" (the run's order, the default) or "prompt_id"
  bool   descending = 11;
  string checkpoint = 12;
}

message BenchtestCaseList {
  int32 total  = 1;
  int32 offset = 2;
  int32 limit  = 3;
  repeated RunCase cases = 4;
  string error = 5;
}

message GetBenchtestCaseRequest {
  int64 run_id = 1;
  int32 seq    = 2;
}

// The four things the case drawer shows, named for what they are rather than for how they are
// stored: the prompt that was meant to be sent, the model's answer, and the two envelopes those
// travelled in. Showing the prompt beside the raw request is the point — a disputed verdict is
// settled by seeing that what went out was what was meant to go out.
message BenchtestCaseDetail {
  reserved 5;
  reserved "prompt";

  RunCase summary      = 1;
  string  scan_id      = 2;
  string  caught       = 3;
  int32   http_status  = 4;
  string  contents_json = 11;  // Request: 세트가 이 케이스에 대해 보내기로 한 contents 배열
  string  response     = 6;   // Response: the model's text
  string  raw_request  = 7;   // Raw request: the whole request that was sent
  string  raw_response = 8;   // Raw response: the whole document that came back
  string  tool_calls   = 9;
  string  error        = 10;
}
